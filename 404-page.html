
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Stackly Fashion Boutique</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <main class="fashion-404-page">

        <div class="fashion-404-card">

            <!-- STACKLY LOGO -->
            <a href="index.html" class="error-logo">
                <img src="assets/black-logo.webp"
                     alt="Stackly Fashion Boutique">
            </a>

            <!-- ERROR NUMBER -->
            <div class="error-number">
                4<span class="error-home-icon">
                    <span class="material-symbols-outlined">
                        home
                    </span>
                </span>4
            </div>

            <span class="error-eyebrow">
                A LITTLE OFF THE STYLE PATH
            </span>

            <!-- HEADING -->
            <h1>
                This Page Has
                <span>Gone Out of Style.</span>
            </h1>

            <p class="error-description">
                Looks like this page is no longer available.
                Let's get you back to discovering beautiful
                styles and timeless fashion.
            </p>

            <!-- BUTTONS -->
            <div class="error-buttons">

                <a href="index.html" class="error-home-btn">
                    Back to Home
                </a>

                <button type="button"
                        class="error-back-btn"
                        onclick="history.back()">
                    Go Back
                </button>

            </div>

            <div class="error-code">
                ERROR CODE <strong>404</strong>
            </div>

        </div>

        <p class="error-footer-text">

        </p>
